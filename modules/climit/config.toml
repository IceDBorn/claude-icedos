[icedos.applications.claude-code.users.username.climit]
interval = 180
alerts = true
widget = true
statusLine = true
alertUrgency = "normal"
alertTimeout = 10
alertTransient = false

# Zed keybind to spawn the climit dashboard (ctrl-alt-v; ctrl-alt-l collides
# with Zed default lsp_tool::ToggleMenu + KDE lock).
keybind = "ctrl-alt-v"
